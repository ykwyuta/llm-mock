name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 21 is what the project targets (<java.version> in pom.xml). To check a newer JDK
      # too, turn this step into a matrix over java-version; the build itself still
      # compiles with release 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The suite needs no network beyond dependency resolution: the proxy tests use a
      # second instance of this application as their upstream, so no vendor API is called
      # and no API key or AWS credential is required.
      - name: build & test
        run: ./mvnw -B --no-transfer-progress verify

      - name: upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
